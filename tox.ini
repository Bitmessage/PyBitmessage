[tox]
requires = virtualenv<20.22.0
envlist = reset,py{27,27-portable,35,36,38,39,310},stats
skip_missing_interpreters = true

[testenv]
setenv =
    BITMESSAGE_HOME = {envtmpdir}
    HOME = {envtmpdir}
    PYTHONWARNINGS = default
deps = -rrequirements.txt
commands =
    python checkdeps.py
    python src/bitmessagemain.py -t
    coverage run -a -m tests

[testenv:lint-basic]
skip_install = true
basepython = python3
deps =
    bandit
    flake8
commands =
    bandit -r -s B101,B411,B413,B608 \
    -x checkdeps.*,bitmessagecurses,bitmessageqt,tests pybitmessage
    flake8 pybitmessage --count --select=E9,F63,F7,F82 \
    --show-source --statistics

[testenv:lint]
skip_install = true
basepython = python3
deps =
     -rrequirements.txt
     pylint
commands = pylint --rcfile=tox.ini --exit-zero pybitmessage

[testenv:bandit]
skip_install = true
basepython = python3
deps =
    bandit
commands =
    bandit -r -s B101,B411,B413,B608 \
    -x checkdeps.*,bitmessagecurses,bitmessageqt,tests pybitmessage

[testenv:flake8]
skip_install = true
basepython = python3
deps =
    flake8
commands =
    flake8 --config=tox.ini pybitmessage --count --select=E9,F63,F7,F82 \
    --show-source --statistics

[testenv:pylint]
skip_install = true
basepython = python3
deps =
     -rrequirements.txt
     pylint
commands = pylint --rcfile=tox.ini --exit-zero pybitmessage

[testenv:pycodestyle]
skip_install = true
basepython = python3
deps =
    pycodestyle
commands =
    pycodestyle --config=tox.ini pybitmessage

[testenv:bandit-py27]
skip_install = true
basepython = python2.7
deps =
    bandit<1.7.0
commands =
    bandit -r -s B101,B411,B413,B603,B608 \
    -x checkdeps.*,bitmessagecurses,bitmessageqt,tests pybitmessage

[testenv:flake8-py27]
skip_install = true
basepython = python2.7
deps =
    flake8<4.0.0
commands =
    flake8 --config=tox.ini pybitmessage --count --select=E9,F63,F7,F82 \
    --show-source --statistics

[testenv:pycodestyle-py27]
skip_install = true
basepython = python2.7
deps =
    pycodestyle<2.6.0
commands =
    pycodestyle --config=tox.ini pybitmessage

[testenv:pylint-py27]
skip_install = true
basepython = python2.7
deps =
     -rrequirements.txt
     pylint<2.0.0
commands = pylint --rcfile=tox.ini --ignore=bitmessagekivy pybitmessage

[testenv:py27]
sitepackages = true

[testenv:py27-doc]
deps =
    .[docs]
    -r docs/requirements.txt
commands = python setup.py build_sphinx

[testenv:py27-portable]
skip_install = true
commands = python pybitmessage/bitmessagemain.py -t

[testenv:py35]
skip_install = true

[testenv:py36]
setenv =
    BITMESSAGE_TEST_POW = true
    {[testenv]setenv}

[testenv:reset]
skip_install = true
deps = coverage
commands = coverage erase

[testenv:stats]
skip_install = true
deps = coverage
commands =
    coverage report
    coverage xml

[coverage:run]
source = src
omit =
    tests.py
    */tests/*
    src/bitmessagekivy/*
    src/version.py
    src/fallback/umsgpack/*

[coverage:report]
ignore_errors = true

[pycodestyle]
max-line-length = 119
ignore = E402,E722,W503

[flake8]
max-line-length = 119
exclude = bitmessagecli.py,bitmessagecurses,bitmessageqt,plugins,tests,umsgpack
ignore = E722,F841,W503
# E722: pylint is preferred for bare-except
# F841: pylint is preferred for unused-variable
# W503: deprecated: https://bugs.python.org/issue26763 - https://www.python.org/dev/peps/pep-0008/#should-a-line-break-before-or-after-a-binary-operator

# -- pylint (modern, >= 2.14) -- pylint.*-prefixed sections for setup.cfg/tox.ini

[pylint.main]
ignore = bitmessagecurses,bitmessagekivy,bitmessageqt,messagetypes,mockbm,
    network,plugins,umsgpack,bitmessagecli.py

[pylint.messages_control]
disable =
    invalid-name,consider-using-f-string,fixme,raise-missing-from,
    relative-import,super-with-arguments,unnecessary-pass,unknown-option-value,
    unspecified-encoding,useless-object-inheritance,useless-option-value,
    bad-option-value,missing-docstring,import-error,wrong-import-order,
    inconsistent-return-statements,super-init-not-called,bad-continuation,
    no-member,ungrouped-imports,wrong-import-position,len-as-condition,
    redefined-argument-from-local,too-few-public-methods,
    attribute-defined-outside-init,duplicate-code,too-many-statements,
    too-many-locals,too-many-instance-attributes,unneeded-not,
    no-else-return,access-member-before-definition,
    too-many-public-methods

[pylint.design]
max-args = 8
max-positional-arguments = 8
max-attributes = 8

# -- pylint (legacy, < 2.0 / python 2.7) -- old .pylintrc-style section names

[MASTER]
ignore = bitmessagecurses,bitmessagekivy,bitmessageqt,messagetypes,mockbm,
    network,plugins,umsgpack,bitmessagecli.py

[MESSAGES CONTROL]
disable =
    invalid-name,bare-except,broad-except,relative-import,
    superfluous-parens,bad-option-value

[DESIGN]
max-args = 8
max-attributes = 8
